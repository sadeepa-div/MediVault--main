services:
  database:
    build:
      context: ./database
    container_name: medivault-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medivault
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      MYSQL_USER: ${DB_USER:-medivault_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    volumes:
      - medivault-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Backend
    container_name: medivault-backend
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: "5001"
      DB_HOST: database
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-medivault_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_NAME: "medivault"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_USE_MOCK: "false"
    container_name: medivault-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  medivault-data:
