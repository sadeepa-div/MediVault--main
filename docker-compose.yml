services:
  backend:
    build:
      context: ./Backend
    container_name: medivault-backend
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: "5001"
      DB_HOST: "host.docker.internal"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "Bhanu@1110"
      DB_NAME: "medivault"
      JWT_SECRET: "change_this_secret"
      GOOGLE_CLIENT_ID: "your_google_client_id"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_USE_MOCK: "false"
    container_name: medivault-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
